name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore default debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          fi

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleOnlineDebug assembleOfflineDebug --no-daemon

      - name: Upload Online Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-online-debug
          path: '**/build/outputs/apk/online/debug/*.apk'
          retention-days: 7

      - name: Upload Offline Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-offline-debug
          path: '**/build/outputs/apk/offline/debug/*.apk'
          retention-days: 7
