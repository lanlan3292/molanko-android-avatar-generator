name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore default debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleOnlineDebug assembleOfflineDebug

      - name: Upload Online Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-online-debug
          path: '**/build/outputs/apk/online/debug/*.apk'
          retention-days: 7

      - name: Upload Offline Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-offline-debug
          path: '**/build/outputs/apk/offline/debug/*.apk'
          retention-days: 7
